version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      platforms:
        - linux/amd64
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DEMO_MODE=local-ideal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      platforms:
        - linux/amd64
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
